<!DOCTYPE html>
<html lang="zh-Hans">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="One More 使用教程。">
  <title>使用方法 | One More</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f4f4ef'/%3E%3Cpath d='M24 18v28l22-14z' fill='%23090909'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
    rel="stylesheet">

  <style>
    :root {
      --background: #090909;
      --foreground: #f4f4ef;
      --muted-foreground: #999994;
      --border: #292929;
      --hover: #141414;
      --lime: #c6e850;
      --radius: 0.5rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      padding: 1.5rem 2rem;
      background: var(--background);
      color: var(--foreground);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
    }

    .shell {
      width: 100%;
      max-width: 640px;
      min-height: calc(100dvh - 3rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      animation: fade-in 0.6s ease-out forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      width: 100%;
      padding: 0.75rem 0 6rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--foreground);
      text-decoration: none;
    }

    .brand-icon {
      display: block;
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .brand-name {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .page-label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    main {
      flex: 1;
      width: 100%;
    }

    .intro {
      margin: 0 0 1.5rem;
      color: var(--muted-foreground);
      font-size: 0.85rem;
      letter-spacing: -0.01em;
    }

    .list {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .tutorial-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.35rem 0.5rem;
      color: var(--foreground);
      text-decoration: none;
    }

    .tutorial-row + .tutorial-row { border-top: 1px solid var(--border); }

    .tutorial-row:hover .tutorial-title { color: var(--lime); }

    .tutorial-title {
      font-size: clamp(0.9rem, 1.2vw, 1rem);
      font-weight: 400;
      letter-spacing: -0.025em;
      transition: color 0.2s;
    }

    .tutorial-date {
      flex: none;
      color: var(--muted-foreground);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
    }

    footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 9rem;
      padding: 2rem 0 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted-foreground);
      font-size: 0.75rem;
      opacity: 0.65;
      transition: opacity 0.2s;
    }

    footer:hover,
    footer:has(.lang-dropdown.open) {
      opacity: 1;
    }

    footer a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: #3a3a3a;
      text-underline-offset: 3px;
      transition: text-decoration-color 0.2s;
    }

    footer a:hover {
      text-decoration-color: var(--foreground);
    }

    .sep {
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }

    .lang-switcher {
      position: relative;
      margin-left: auto;
    }

    .lang-btn {
      border: none;
      padding: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      right: 0;
      bottom: 100%;
      min-width: 120px;
      margin-bottom: 0.5rem;
      padding: 0.25rem 0;
      border: 1px solid #444;
      border-radius: var(--radius);
      background: #222;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }

    .lang-dropdown.open { display: block; }

    .lang-option {
      display: block;
      width: 100%;
      border: none;
      padding: 0.4rem 0.75rem;
      background: transparent;
      color: var(--muted-foreground);
      font-family: inherit;
      font-size: 0.75rem;
      text-align: left;
      cursor: pointer;
    }

    .lang-option:hover {
      background: #333;
      color: var(--foreground);
    }

    .lang-option.active { color: var(--foreground); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 560px) {
      body { padding: 1rem; }
      .shell { min-height: calc(100dvh - 2rem); }
      header { width: 100%; padding-bottom: 4.5rem; }
      main { width: 100%; }
      .brand-icon { width: 28px; height: 28px; }
      .tutorial-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.6rem;
        padding: 1.2rem 0.25rem;
      }
      .sep { display: none; }
      footer { margin-top: 6rem; gap: 0.5rem 1rem; }
      .lang-switcher { margin-left: 0; }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <a class="brand" href="index.html" aria-label="One More">
        <svg class="brand-icon" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#f4f4ef"></rect>
          <path d="M24 18v28l22-14z" fill="#090909"></path>
        </svg>
        <span class="brand-name">ONE MORE</span>
      </a>
      <div class="page-label" data-i18n="page_label">使用方法</div>
    </header>

    <main>
      <p class="intro" data-i18n="intro">EMP 与 One More 的使用说明会整理在这里。</p>
      <div class="list">
        <a class="tutorial-row" href="https://blog.imyiangyang.top/posts/one-more-emp-guide/"
           target="_blank" rel="noopener noreferrer">
          <span class="tutorial-title" data-i18n="emp_guide">EMP 介绍以及使用方法</span>
          <span class="tutorial-date mono"><span data-i18n="date_label">日期</span> 2026-11-09</span>
        </a>
      </div>
    </main>

    <footer>
      <span class="mono">© 2026 One More</span>
      <span class="sep mono" aria-hidden="true">·</span>
      <a href="index.html" class="mono" data-i18n="back_home">返回首页</a>
      <span class="sep mono" aria-hidden="true">·</span>
      <a href="privacy.html" class="mono" data-i18n="privacy">隐私政策</a>
      <span class="sep mono" aria-hidden="true">·</span>
      <a href="tutorials.html" class="mono" data-i18n="tutorials_link">使用方法</a>
      <span class="sep mono" aria-hidden="true">·</span>
      <div class="lang-switcher">
        <button class="lang-btn mono" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <div class="lang-dropdown" id="lang-dropdown" role="menu"></div>
      </div>
    </footer>
  </div>

  <script>
    const i18n = {
      "zh-Hans": {
        page_title: "使用方法 | One More",
        page_label: "使用方法",
        intro: "EMP 与 One More 的使用说明会整理在这里。",
        date_label: "日期",
        back_home: "返回首页",
        privacy: "隐私政策",
        tutorials_link: "使用方法",
        emp_guide: "EMP 介绍以及使用方法"
      },
      "zh-Hant": {
        page_title: "使用方法 | One More",
        page_label: "使用方法",
        intro: "EMP 與 One More 的使用說明會整理在這裡。",
        date_label: "日期",
        back_home: "返回首頁",
        privacy: "隱私權政策",
        tutorials_link: "使用方法",
        emp_guide: "EMP 介紹以及使用方法（簡體中文）"
      },
      "en": {
        page_title: "Tutorials | One More",
        page_label: "Tutorials",
        intro: "Guides for EMP and One More live here.",
        date_label: "Date",
        back_home: "Home",
        privacy: "Privacy Policy",
        tutorials_link: "Tutorials",
        emp_guide: "EMP introduction and how to use it (Chinese)"
      },
      "ja": {
        page_title: "使い方 | One More",
        page_label: "使い方",
        intro: "EMP と One More の使い方をまとめています。",
        date_label: "日付",
        back_home: "ホームへ戻る",
        privacy: "プライバシーポリシー",
        tutorials_link: "使い方",
        emp_guide: "EMP の紹介と使い方（中国語）"
      },
      "ko": {
        page_title: "사용 방법 | One More",
        page_label: "사용 방법",
        intro: "EMP와 One More 사용 방법을 모아 둡니다.",
        date_label: "날짜",
        back_home: "홈으로",
        privacy: "개인정보 처리방침",
        tutorials_link: "사용 방법",
        emp_guide: "EMP 소개 및 사용 방법 (중국어)"
      }
    };

    const langNames = {
      "zh-Hans": "简体中文",
      "zh-Hant": "繁體中文",
      "en": "English",
      "ja": "日本語",
      "ko": "한국어"
    };

    const pageKey = 'one_more_site_lang';

    function applyLang(lang) {
      const t = i18n[lang];
      if (!t) return;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll('.lang-option').forEach(opt => {
        const active = opt.getAttribute('data-lang') === lang;
        opt.classList.toggle('active', active);
        opt.setAttribute('aria-current', String(active));
      });
      document.getElementById('lang-btn').textContent = langNames[lang] + ' ▾';
      document.documentElement.lang = lang;
      document.title = t.page_title;
    }

    function detectLang() {
      const hashMatch = location.hash.match(/lang=([a-zA-Z-]+)/);
      if (hashMatch && i18n[hashMatch[1]]) return hashMatch[1];
      try {
        const stored = localStorage.getItem(pageKey);
        if (stored && i18n[stored]) return stored;
      } catch (e) {}
      const nav = (navigator.language || 'en').toLowerCase();
      if (nav.startsWith('zh')) {
        if (nav.includes('hant') || nav.includes('tw') || nav.includes('hk') || nav.includes('mo')) return 'zh-Hant';
        return 'zh-Hans';
      }
      if (nav.startsWith('ja')) return 'ja';
      if (nav.startsWith('ko')) return 'ko';
      return 'en';
    }

    (function () {
      const dropdown = document.getElementById('lang-dropdown');
      const toggleBtn = document.getElementById('lang-btn');
      Object.keys(langNames).forEach(code => {
        const opt = document.createElement('button');
        opt.className = 'lang-option mono';
        opt.type = 'button';
        opt.setAttribute('data-lang', code);
        opt.setAttribute('role', 'menuitem');
        opt.textContent = langNames[code];
        opt.addEventListener('click', () => {
          location.hash = 'lang=' + code;
          try { localStorage.setItem(pageKey, code); } catch (e) {}
          applyLang(code);
          dropdown.classList.remove('open');
          toggleBtn.setAttribute('aria-expanded', 'false');
        });
        dropdown.appendChild(opt);
      });
      toggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = dropdown.classList.toggle('open');
        toggleBtn.setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', () => {
        dropdown.classList.remove('open');
        toggleBtn.setAttribute('aria-expanded', 'false');
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          dropdown.classList.remove('open');
          toggleBtn.setAttribute('aria-expanded', 'false');
          toggleBtn.focus();
        }
      });
    })();

    applyLang(detectLang());
    window.addEventListener('hashchange', () => applyLang(detectLang()));
  </script>
</body>

</html>
