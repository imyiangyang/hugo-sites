<!DOCTYPE html>
<html lang="zh-Hans">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="VBCC 使用教程。">
  <title>使用方法 | VBCC</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --background: hsl(0 0% 3.9%);
      --foreground: hsl(0 0% 98%);
      --muted-foreground: hsl(240 5% 64.9%);
      --border: hsl(0 0% 14.9%);
      --hover: hsl(0 0% 7%);
      --radius: 0.5rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100dvh;
      padding: 1.5rem 2rem;
      background: var(--background);
      color: var(--foreground);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', monospace;
    }

    .shell {
      width: 100%;
      max-width: 640px;
      min-height: calc(100dvh - 3rem);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      animation: fade-in 0.6s ease-out forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      width: 100%;
      padding: 0.75rem 0 6rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--foreground);
      text-decoration: none;
    }

    .brand-icon {
      display: block;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      object-fit: cover;
    }

    .brand-name {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .page-label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    main {
      flex: 1;
      width: 100%;
    }

    .list {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .tutorial-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      padding: 1.35rem 0.5rem;
      color: var(--foreground);
      text-decoration: none;
    }

    .tutorial-row + .tutorial-row { border-top: 1px solid var(--border); }

    .tutorial-title {
      font-size: clamp(0.9rem, 1.2vw, 1rem);
      font-weight: 400;
      letter-spacing: -0.025em;
    }

    .tutorial-date {
      flex: none;
      color: var(--muted-foreground);
      font-size: 0.72rem;
      letter-spacing: 0.02em;
    }

    footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.85rem;
      margin-top: 9rem;
      padding: 2rem 0 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted-foreground);
      font-size: 0.75rem;
      opacity: 0.65;
      transition: opacity 0.2s;
    }

    footer:hover,
    footer:has(.lang-dropdown.open) {
      opacity: 1;
    }

    footer a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: hsl(0 0% 25%);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.2s;
    }

    footer a:hover {
      text-decoration-color: var(--foreground);
    }

    .sep {
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }

    .lang-switcher {
      position: relative;
      margin-left: auto;
    }

    .lang-btn {
      border: none;
      padding: 0;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .lang-dropdown {
      display: none;
      position: absolute;
      right: 0;
      bottom: 100%;
      min-width: 120px;
      margin-bottom: 0.5rem;
      padding: 0.25rem 0;
      border: 1px solid #444;
      border-radius: var(--radius);
      background: #222;
      box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }

    .lang-dropdown.open { display: block; }

    .lang-option {
      display: block;
      width: 100%;
      border: none;
      padding: 0.4rem 0.75rem;
      background: transparent;
      color: var(--muted-foreground);
      font-family: inherit;
      font-size: 0.75rem;
      text-align: left;
      cursor: pointer;
    }

    .lang-option:hover {
      background: #333;
      color: var(--foreground);
    }

    .lang-option.active { color: var(--foreground); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 560px) {
      body { padding: 1rem; }
      .shell { min-height: calc(100dvh - 2rem); }
      header { width: 100%; padding-bottom: 4.5rem; }
      main { width: 100%; }
      .brand-icon { width: 28px; height: 28px; }
      .tutorial-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.6rem;
        padding: 1.2rem 0.25rem;
      }
      footer { margin-top: 6rem; }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header>
      <a class="brand" href="index.html" aria-label="VBCC">
        <picture>
          <source srcset="icon-256.webp" type="image/webp">
          <img class="brand-icon" src="icon-256.png" alt="" width="44" height="44">
        </picture>
        <span class="brand-name">VBCC</span>
      </a>
      <div class="page-label" data-i18n="page_label">使用方法</div>
    </header>

    <main>
      <div class="list">
        <a class="tutorial-row" href="https://blog.imyiangyang.top/posts/vbcc-mac-2-0-guide/"
           target="_blank" rel="noopener noreferrer">
          <span class="tutorial-title" data-i18n="mac_guide">Mac 2.0 触控板使用指南</span>
          <span class="tutorial-date mono"><span data-i18n="date_label">日期</span> 2026-10-21</span>
        </a>
        <a class="tutorial-row" href="https://blog.imyiangyang.top/posts/asr-provider-doubao/"
           target="_blank" rel="noopener">
          <span class="tutorial-title" data-i18n="doubao_guide">如何在 VBCC 中添加豆包 ASR 识别引擎</span>
          <span class="tutorial-date mono"><span data-i18n="date_label">日期</span> 2026-06-01</span>
        </a>
      </div>
    </main>

    <footer>
      <span class="mono">© 2026 VBCC</span>
      <span class="sep mono" aria-hidden="true">·</span>
      <a href="index.html" class="mono" data-i18n="back_home">返回首页</a>
      <span class="sep mono" aria-hidden="true">·</span>
      <a href="privacy.html" class="mono" data-i18n="privacy">隐私政策</a>
      <span class="sep mono" aria-hidden="true">·</span>
      <a href="tutorials.html" class="mono" data-i18n="tutorials_link">使用方法</a>
      <span class="sep mono" aria-hidden="true">·</span>
      <div class="lang-switcher">
        <button class="lang-btn mono" id="lang-btn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="lang-dropdown" id="lang-dropdown" role="menu"></div>
      </div>
    </footer>
  </div>

  <script>
    const i18n = {
      "zh-Hans": {
        "mac_guide": "Mac 2.0 触控板使用指南",
        "doubao_guide": "如何在 VBCC 中添加豆包 ASR 识别引擎",
        page_title: "使用方法 | VBCC",
        page_label: "使用方法",
        date_label: "日期",
        back_home: "返回首页",
        privacy: "隐私政策",
        tutorials_link: "使用方法"
      },
      "zh-Hant": {
        "mac_guide": "Mac 2.0 觸控板使用指南（簡體中文）",
        "doubao_guide": "如何在 VBCC 中加入豆包 ASR 辨識引擎（簡體中文）",
        page_title: "使用方法 | VBCC",
        page_label: "使用方法",
        date_label: "日期",
        back_home: "返回首頁",
        privacy: "隱私權政策",
        tutorials_link: "使用方法"
      },
      "en": {
        "mac_guide": "Mac 2.0 trackpad guide (Chinese)",
        "doubao_guide": "Set up Doubao ASR in VBCC (Chinese)",
        page_title: "Tutorials | VBCC",
        page_label: "Tutorials",
        date_label: "Date",
        back_home: "Home",
        privacy: "Privacy Policy",
        tutorials_link: "Tutorials"
      },
      "ja": {
        "mac_guide": "Mac 2.0 トラックパッドガイド（中国語）",
        "doubao_guide": "VBCC で豆包 ASR を設定する（中国語）",
        page_title: "使い方 | VBCC",
        page_label: "使い方",
        date_label: "日付",
        back_home: "ホームへ戻る",
        privacy: "プライバシーポリシー",
        tutorials_link: "使い方"
      },
      "ko": {
        "mac_guide": "Mac 2.0 트랙패드 안내 (중국어)",
        "doubao_guide": "VBCC에서 Doubao ASR 설정하기 (중국어)",
        page_title: "사용 방법 | VBCC",
        page_label: "사용 방법",
        date_label: "날짜",
        back_home: "홈으로",
        privacy: "개인정보 처리방침",
        tutorials_link: "사용 방법"
      }
    };

    const langNames = {
      "zh-Hans": "简体中文",
      "zh-Hant": "繁體中文",
      "en": "English",
      "ja": "日本語",
      "ko": "한국어"
    };

    function applyLang(lang) {
      const t = i18n[lang];
      if (!t) return;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });
      document.querySelectorAll('.lang-option').forEach(opt => {
        opt.classList.toggle('active', opt.getAttribute('data-lang') === lang);
      });
      document.getElementById('lang-btn').textContent = langNames[lang] + ' ▾';
      document.documentElement.lang = lang;
      document.title = t.page_title;
    }

    function detectLang() {
      const hashMatch = location.hash.match(/lang=([a-zA-Z-]+)/);
      if (hashMatch && i18n[hashMatch[1]]) return hashMatch[1];
      try {
        const stored = localStorage.getItem('vbcc_lang');
        if (stored && i18n[stored]) return stored;
      } catch (e) {}
      const nav = (navigator.language || 'en').toLowerCase();
      if (nav.startsWith('zh')) {
        if (nav.includes('hant') || nav.includes('tw') || nav.includes('hk') || nav.includes('mo')) return 'zh-Hant';
        return 'zh-Hans';
      }
      if (nav.startsWith('ja')) return 'ja';
      if (nav.startsWith('ko')) return 'ko';
      return 'en';
    }

    (function () {
      const dropdown = document.getElementById('lang-dropdown');
      const toggleBtn = document.getElementById('lang-btn');
      Object.keys(langNames).forEach(code => {
        const opt = document.createElement('button');
        opt.className = 'lang-option mono';
        opt.setAttribute('data-lang', code);
        opt.setAttribute('role', 'menuitem');
        opt.textContent = langNames[code];
        opt.addEventListener('click', () => {
          location.hash = 'lang=' + code;
          try { localStorage.setItem('vbcc_lang', code); } catch (e) {}
          applyLang(code);
          dropdown.classList.remove('open');
          toggleBtn.setAttribute('aria-expanded', 'false');
        });
        dropdown.appendChild(opt);
      });
      toggleBtn.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = dropdown.classList.toggle('open');
        toggleBtn.setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', () => {
        dropdown.classList.remove('open');
        toggleBtn.setAttribute('aria-expanded', 'false');
      });
    })();

    applyLang(detectLang());
    window.addEventListener('hashchange', () => applyLang(detectLang()));
  </script>
</body>

</html>
